name: Sync upstream skills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Maharat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize allow-listed upstream paths
        run: python3 scripts/sync_sources.py

      - name: Validate synchronized skills
        run: bash scripts/validate-maharat.sh

      - name: Open review pull request when sources changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No upstream changes detected."
            exit 0
          fi

          branch="automation/sync-skills-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills licenses upstreams
          git commit -m "chore: sync upstream skills"
          git push --force-with-lease --set-upstream origin "$branch"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: sync upstream skills" \
            --body-file .github/SYNC_PR_TEMPLATE.md
